<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI가 요약해줘도 나는 손으로 읽는다</title>
<meta name="author" content="leaf meta">
<meta name="description" content="AI에게 요약은 맡기되 판단은 내 손과 머리로 하는 30일 아날로그 독서노트 훈련.">
<link rel="stylesheet" href="viewer/app.css">
<script>
  try {
    var t = localStorage.getItem('aibook.theme');
    document.documentElement.setAttribute('data-theme', t || 'light');
    var fs = localStorage.getItem('aibook.fs');
    if (fs) document.documentElement.style.setProperty('--fs', fs + 'px');
  } catch (e) {}
</script>
</head>
<body>

<header class="topbar">
  <button id="menu" class="icon-btn only-narrow" aria-label="차례 열기" aria-expanded="false">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
  </button>

  <a class="mark" href="#/README.md" aria-label="처음으로">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
  </a>

  <a class="titles" href="#/README.md" aria-label="처음으로">
    <h1>AI가 요약해줘도 나는 손으로 읽는다</h1>
    <p>30일 아날로그 독서노트 훈련</p>
  </a>

  <div class="tools">
    <button id="print-page" class="icon-btn" aria-label="현재 페이지 인쇄하기" title="현재 페이지 인쇄하기 (P)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3.5h10V8M7 17.5H5.5A1.5 1.5 0 0 1 4 16v-5A1.5 1.5 0 0 1 5.5 9.5h13A1.5 1.5 0 0 1 20 11v5a1.5 1.5 0 0 1-1.5 1.5H17M7 14h10v6.5H7z"/></svg>
    </button>
    <div class="fontsize" role="group" aria-label="글자 크기">
      <button id="font-down" class="icon-btn" aria-label="글자 작게">A−</button>
      <button id="font-up" class="icon-btn" aria-label="글자 크게">A+</button>
    </div>
    <button id="theme" class="icon-btn" aria-label="밝기 바꾸기" title="밝기 바꾸기 (T)">
      <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
    <div class="star">
      <a class="star-act" href="https://github.com/leaf-kit/book-read-by-hand" target="_blank" rel="noopener" title="깃허브에서 이 저장소에 별 주기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.4l2.65 5.37 5.93.86-4.29 4.18 1.01 5.9L12 16.92l-5.3 2.79 1.01-5.9L3.42 9.63l5.93-.86z"/></svg>
        <span>Star</span>
      </a>
      <a class="star-n" id="star-n" href="https://github.com/leaf-kit/book-read-by-hand" target="_blank" rel="noopener" hidden></a>
    </div>
  </div>
</header>

<div class="shell">
  <div id="scrim" hidden></div>

  <aside id="sidebar" aria-label="차례">
    <div class="side-search">
      <label class="field">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5 17 17"/></svg>
        <input id="q" type="search" placeholder="제목 검색 ( / )" autocomplete="off" aria-label="제목 검색">
        <button id="q-clear" class="icon-btn" aria-label="검색어 지우기" hidden>×</button>
      </label>
      <button id="fulltext" class="wide-btn" hidden>본문 전체에서 "<span></span>" 찾기</button>
      <p id="q-hint" class="hint" hidden></p>
    </div>
    <nav id="toc" class="toc"><p class="loading">차례를 읽는 중…</p></nav>
  </aside>

  <main id="main">
    <div class="progress" aria-hidden="true"><i id="progressbar"></i></div>
    <div class="paper">
      <article id="doc" class="md"><p class="loading">여는 중…</p></article>
      <nav class="pager" id="pager" hidden>
        <a class="pg prev" id="pg-prev" rel="prev"><span class="dir">← 이전</span><span class="t"></span></a>
        <a class="pg next" id="pg-next" rel="next"><span class="dir">다음 →</span><span class="t"></span></a>
      </nav>
    </div>
    <button id="totop" class="totop" aria-label="맨 위로" hidden>↑</button>
  </main>
</div>

<footer class="bottombar">
  <span>본문 39장과 부록 4편. 읽기, 쓰기, 연결하기, AI와의 선 긋기, 30일 챌린지, 지속과 공유를 다룬다.</span>
  <span class="keys">←, → 이전 다음 장 &nbsp; / 검색 &nbsp; T 밝기 &nbsp; P 인쇄</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="viewer/app.js"></script>
</body>
</html>
